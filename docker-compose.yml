services:
  postgres:
    image: postgres:16-alpine
    container_name: cubesmp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cubesmp
      POSTGRES_USER: cubesmp
      POSTGRES_PASSWORD: cubesmp_local_only
    ports:
      - "5432:5432"
    volumes:
      - cubesmp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cubesmp -d cubesmp"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  cubesmp_pgdata:
